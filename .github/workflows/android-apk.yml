name: Android APK

# Builds an installable APK on GitHub's free runners (no Expo account needed).
# Started by hand (Actions -> Android APK -> Run workflow) and on pull requests,
# so each PR is checked and comes with an APK to try. Every run uploads the APK
# as a workflow artifact; runs on main also publish it to the "latest-android"
# release so it can be downloaded straight to a phone.

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and test
        run: |
          npx tsc --noEmit
          npx expo lint
          npm test

      - name: Generate native Android project
        run: |
          npx expo prebuild --platform android --no-install
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties

      - name: Build release APKs
        working-directory: android
        # Real phones only need the ARM builds; skipping x86 halves build time.
        # One APK per CPU type (abiSplits) with compressed native libraries
        # (useLegacyPackaging) keeps the download small.
        run: >
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          -Pbudget.abiSplits=true
          -Pexpo.useLegacyPackaging=true

      - name: Name the APKs
        run: |
          mkdir -p dist
          out=android/app/build/outputs/apk/release
          cp $out/app-arm64-v8a-release.apk dist/budget-logger.apk
          cp $out/app-armeabi-v7a-release.apk dist/budget-logger-32bit.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: budget-logger-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish to the latest-android release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-android
          name: Latest Android build
          prerelease: true
          make_latest: false
          files: dist/*.apk
          body: |
            Built from ${{ github.sha }}. Download budget-logger.apk on your Android phone and open it to install.
            budget-logger-32bit.apk is only for old phones that can't install the first one ("App not installed" or "not compatible").
            Signed with a development key: fine for personal and family use, not for the Play Store.
